[package]
name = "telorama"
version = "0.5.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Command line front end for the telorama visualization engine"
repository = "https://github.com/david-engelmann/telorama"
homepage = "https://github.com/david-engelmann/telorama"
readme = "README.md"
keywords = ["opentelemetry", "visualization", "cli", "traces", "observability"]
categories = ["command-line-utilities", "visualization"]

[[bin]]
name = "telorama"
path = "src/main.rs"

[dependencies]
serde_json = { workspace = true }
telorama-scene = { workspace = true }
telorama-ingest = { workspace = true }
telorama-svg = { workspace = true }
