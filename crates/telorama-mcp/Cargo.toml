[package]
name = "telorama-mcp"
version = "0.4.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "MCP server for the telorama visualization engine"
repository = "https://github.com/david-engelmann/telorama"
homepage = "https://github.com/david-engelmann/telorama"
readme = "README.md"
keywords = ["opentelemetry", "visualization", "mcp", "mcp-apps", "observability"]
categories = ["visualization"]

[[bin]]
name = "telorama-mcp"
path = "src/main.rs"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
telorama-scene = { workspace = true }
telorama-ingest = { workspace = true }
telorama-svg = { workspace = true }
