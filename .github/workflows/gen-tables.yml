name: gen-tables

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Derive the width tables and splice them into lib.rs
        run: |
          python3 - <<'PYEOF'
          import unicodedata

          assert unicodedata.unidata_version == "15.0.0", unicodedata.unidata_version
          NAMED = {0x200B, 0x200C, 0x200D, 0xFEFF}

          def ranges_for(pred):
              rs, start, prev = [], None, None
              for cp in range(0x110000):
                  ok = False if 0xD800 <= cp <= 0xDFFF else pred(cp)
                  if ok and start is None:
                      start = prev = cp
                  elif ok:
                      prev = cp
                  elif start is not None:
                      rs.append((start, prev))
                      start = None
              if start is not None:
                  rs.append((start, prev))
              return rs

          zero = ranges_for(lambda cp: unicodedata.category(chr(cp)) in ("Mn", "Me") or cp in NAMED)
          wide = ranges_for(lambda cp: unicodedata.east_asian_width(chr(cp)) in ("W", "F"))

          def rule_width(cp):
              ch = chr(cp)
              if unicodedata.category(ch) in ("Mn", "Me") or cp in NAMED:
                  return 0
              if unicodedata.east_asian_width(ch) in ("W", "F"):
                  return 2
              return 1

          def in_rs(rs, cp):
              import bisect
              starts = [a for a, _ in rs]
              i = bisect.bisect_right(starts, cp) - 1
              return i >= 0 and rs[i][0] <= cp <= rs[i][1]

          disagreements = 0
          for cp in range(0x110000):
              if 0xD800 <= cp <= 0xDFFF:
                  continue
              built = 0 if in_rs(zero, cp) else (2 if in_rs(wide, cp) else 1)
              if built != rule_width(cp):
                  disagreements += 1
          print("zero ranges:", len(zero), "wide ranges:", len(wide), "sweep disagreements:", disagreements)
          assert disagreements == 0

          def table(name, rs):
              lines = [f"const {name}: &[(u32, u32)] = &["]
              lines += [f"    (0x{a:04X}, 0x{b:04X})," for a, b in rs]
              lines.append("];")
              return lines

          zero_doc = [
              "/// Code point ranges whose characters take no width of their",
              "/// own. Derived from the Unicode Character Database as",
              "/// published by the unicodedata module of Python 3.12,",
              "/// Unicode 15.0.0. The table takes every codepoint whose",
              "/// general category is Mn or Me, together with the zero",
              "/// width format characters U+200B to U+200D and U+FEFF,",
              "/// which the design record names because category data",
              "/// alone cannot pick them out from the other format",
              "/// characters. The sweep in the Round 34 record verifies",
              "/// this table against that source.",
          ]
          wide_doc = [
              "/// Code point ranges whose characters take two columns.",
              "/// Derived from the same source as the zero width table",
              "/// above, taking every codepoint whose East Asian Width",
              "/// property is W or F. The ambiguous class is deliberately",
              "/// absent. The renderer's own label separator and",
              "/// truncation ellipsis are ambiguous characters, and they",
              "/// count one, as they did when every width was a count.",
          ]
          region = zero_doc + table("ZERO_WIDTH_RANGES", zero) + [""] + wide_doc + table("WIDE_RANGES", wide)

          path = "crates/telorama-svg/src/lib.rs"
          lines = open(path, encoding="utf-8").read().split("\n")
          start = next(i for i, l in enumerate(lines) if l.startswith("/// Code point ranges whose characters take no width"))
          anchor = next(i for i, l in enumerate(lines) if l.startswith("/// Whether a code point sits inside"))
          end = anchor - 2
          assert lines[end] == "];", lines[end]
          assert lines[anchor - 1] == ""
          lines[start:end + 1] = region
          open(path, "w", encoding="utf-8").write("\n".join(lines))
          print("spliced, new line count:", len(lines))
          PYEOF
      - name: Commit the derived tables
        run: |
          git config user.name "telorama-gen"
          git config user.email "gen@localhost"
          git add crates/telorama-svg/src/lib.rs
          git commit -m "Round 34: derive the width tables from the Unicode data" || echo "no changes"
          git push
