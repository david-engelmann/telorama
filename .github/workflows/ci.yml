name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.100.0
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Package
        run: |
          cargo package -p telorama-scene --locked --no-verify
          cargo package -p telorama-ingest --locked --no-verify
          cargo package -p telorama-svg --locked --no-verify
          cargo package -p telorama --locked --no-verify
          cargo package -p telorama-mcp --locked --no-verify
