name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.100.0
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Package
        run: |
          set -e
          cargo vendor /tmp/staged > /tmp/vendor.toml
          mkdir -p .cargo
          cat /tmp/vendor.toml > .cargo/config.toml
          for k in telorama-scene telorama-ingest telorama-svg telorama telorama-mcp; do
            cargo package -p "$k" --locked --no-verify --offline
            crate_file=$(ls target/package/"$k"-*.crate)
            sum=$(sha256sum "$crate_file" | cut -d' ' -f1)
            rm -rf /tmp/extract && mkdir -p /tmp/extract
            tar -xzf "$crate_file" -C /tmp/extract --strip-components=1
            mkdir -p "/tmp/staged/$k"
            cp -r /tmp/extract/. "/tmp/staged/$k/"
            printf '{"files":{},"package":"%s"}' "$sum" > "/tmp/staged/$k/.cargo-checksum.json"
          done
