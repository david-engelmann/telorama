name: gen-goldens

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version | head -1
      - name: Build the viewer export
        working-directory: web
        run: |
          npm ci
          npm run build
          ls out/
      - name: Install Playwright and Chromium
        working-directory: web
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Write the capture script
        working-directory: web
        run: |
          cat > capture-reel.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs';

          const OUT = 'reel-raw';
          fs.rmSync(OUT, { recursive: true, force: true });
          fs.mkdirSync(OUT, { recursive: true });

          const steps = {
            'sess-2026-1116-demo': 1,
            'conv-2026-1116-demo': 1,
            'conv-genai-demo': 0,
            'sess-oi-demo': 0,
          };

          const t0 = Date.now();
          const log = (msg) =>
            console.log('[capture +' + ((Date.now() - t0) / 1000).toFixed(1) + 's] ' + msg);

          const browser = await chromium.launch();
          const context = await browser.newContext({
            viewport: { width: 1280, height: 800 },
            deviceScaleFactor: 2,
            recordVideo: { dir: OUT, size: { width: 1280, height: 800 } },
          });
          const page = await context.newPage();
          await page.goto('http://127.0.0.1:8931/', { waitUntil: 'networkidle' });
          log('page loaded: ' + (await page.title()));
          await page.waitForTimeout(1500);

          // Masthead, summary bar, provenance line.
          await page.evaluate(() => window.scrollTo(0, 0));
          log('dwelling on the masthead');
          await page.waitForTimeout(3500);

          const sections = page.locator('section.record-section');
          const count = await sections.count();
          log('record sections: ' + count);

          // Incident section.
          const incident = sections.nth(0);
          await incident.evaluate((el) => el.scrollIntoView());
          log('dwelling on the incident section');
          await page.waitForTimeout(5000);

          // Session sections in page order.
          for (let i = 1; i < count; i++) {
            const section = sections.nth(i);
            const heading = (await section.locator('h2').innerText()).trim();
            const id = heading.replace(/^Session\s+/, '').trim();
            await section.evaluate((el) => el.scrollIntoView());
            const label0 = (await section.locator('.stepper-label').innerText()).trim();
            log('session ' + id + ': in view at "' + label0 + '", dwelling');
            await page.waitForTimeout(4000);
            const n = steps[id] ?? 0;
            for (let s = 0; s < n; s++) {
              await section
                .locator('nav.stepper')
                .getByRole('button', { name: 'Previous', exact: true })
                .click();
              const label = (await section.locator('.stepper-label').innerText()).trim();
              log('session ' + id + ': stepped Previous -> "' + label + '", dwelling');
              await page.waitForTimeout(4000);
            }
          }

          // Closing view of the masthead.
          await page.evaluate(() => window.scrollTo(0, 0));
          log('closing dwell on the masthead');
          await page.waitForTimeout(2500);

          await context.close();
          await browser.close();
          log('capture done');
          EOF
          node --check capture-reel.mjs && echo "capture script parses"
      - name: Serve the export and record the reel
        working-directory: web
        run: |
          nohup python3 -m http.server 8931 --directory out >/tmp/serve.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8931/ -o /dev/null; then echo "server up"; break; fi
            sleep 1
          done
          node capture-reel.mjs
          ls -la reel-raw/
          ffprobe -v error -show_entries format=duration,size -show_entries stream=codec_name,width,height -of default=noprint_wrappers=1 reel-raw/*.webm
      - name: Convert the recording and commit the reel
        run: |
          ffmpeg -y -v error -i web/reel-raw/*.webm -c:v libx264 -pix_fmt yuv420p -movflags +faststart docs/media/viewer-reel.mp4
          echo "--- final mp4 facts ---"
          ffprobe -v error -show_entries format=duration,size -show_entries stream=codec_name,width,height -of default=noprint_wrappers=1 docs/media/viewer-reel.mp4
          git config user.name "David Engelmann"
          git config user.email "81196676+david-engelmann@users.noreply.github.com"
          git add docs/media/viewer-reel.mp4
          git status --porcelain
          git commit -m "Round 88: Re-record the viewer reel" -m "Signed-off-by: David Engelmann <81196676+david-engelmann@users.noreply.github.com>"
          git push origin HEAD:round88-reel
