name: gen-goldens
on:
  workflow_dispatch:
jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.100.0
      - name: Generate golden
        run: |
          UPDATE_GOLDENS=1 cargo test -p telorama-svg --test golden_tests golden_incident_checkout_scene
          echo "GOLDEN_BEGIN"
          base64 -w0 tests/golden/incident_checkout_scene.svg
          echo
          echo "GOLDEN_END"
