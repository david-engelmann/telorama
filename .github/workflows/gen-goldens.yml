name: gen-goldens
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.100.0
      - name: Generate the genai agent run dark golden
        run: |
          UPDATE_GOLDENS=1 cargo test -p telorama-svg --test golden_tests golden_agent_run_genai_scene_dark
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tests/golden/agent_run_genai_scene_dark.svg
          git commit -m "Generate the genai agent run dark golden"
          git push
