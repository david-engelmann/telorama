name: gen-goldens
on: workflow_dispatch
permissions:
  contents: write
jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.100.0
      - name: Regenerate the lockfile and commit it back
        run: |
          cargo update -w
          git config user.name "telorama-ci"
          git config user.email "ci@telorama.invalid"
          git add Cargo.lock
          git status --porcelain
          git commit -m "Regenerate Cargo.lock for 0.2.0" || echo "no changes"
          git push origin HEAD:round6-registry
