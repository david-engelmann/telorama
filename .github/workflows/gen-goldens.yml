name: gen-goldens

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.100.0
      - name: Generate the flame golden and print it base64
        run: |
          UPDATE_GOLDENS=1 cargo test -p telorama-svg --test golden_tests golden_flame_scene
          echo "===FLAME_B64_BEGIN==="
          base64 -w0 tests/golden/flame_scene.svg
          echo
          echo "===FLAME_B64_END==="
