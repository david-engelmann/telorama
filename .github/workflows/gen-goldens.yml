name: gen-goldens
on:
  workflow_dispatch:
jobs:
  gen:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.100.0
      - name: Measure the long session fixtures
        run: |
          cargo test -p telorama-ingest --test ingest_tests ten_thousand -- --nocapture 2>&1 | tail -30
