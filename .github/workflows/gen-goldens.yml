name: gen-goldens
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.100.0
      - name: Regenerate the viewer record for the 0.6.0 stamp
        run: |
          UPDATE_RECORD=1 cargo test --workspace
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Round 47: regenerate the viewer record for the 0.6.0 stamp"
          git push origin HEAD:round47-release-060
