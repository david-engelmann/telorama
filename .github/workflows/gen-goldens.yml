name: gen-goldens
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.100.0
      - name: Generate the viewer record from the fixtures
        run: |
          UPDATE_RECORD=1 cargo test -p telorama-mcp --test viewer_record_tests -- --nocapture
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add web/data/record.json
          git commit -m "Generate the viewer record"
          git push origin HEAD:round23-codex-viewer-build
