name: gen-goldens

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.100.0
      - name: Generate the agent run golden and print it base64
        run: |
          UPDATE_GOLDENS=1 cargo test -p telorama-svg --test golden_tests golden_agent_run_scene
          echo "===AGENT_B64_BEGIN==="
          base64 -w0 tests/golden/agent_run_scene.svg
          echo
          echo "===AGENT_B64_END==="
