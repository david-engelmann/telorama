name: gen-goldens
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.100.0
      - name: Generate the wide names golden and the gallery page
        run: |
          UPDATE_GOLDENS=1 cargo test -p telorama-svg --test golden_tests golden_wide_names_scene -- --nocapture
          UPDATE_GALLERY=1 cargo test -p telorama-svg --test gallery_tests -- --nocapture
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tests/golden/wide_names_scene.svg docs/gallery.html
          git commit -m "Generate the wide names golden and the gallery page"
          git push origin HEAD:round32-text-width-build
