name: gen-goldens
on: workflow_dispatch
permissions:
  contents: write
jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.100.0
      - name: Regenerate goldens
        env:
          UPDATE_GOLDENS: "1"
        run: cargo test -p telorama-svg --test golden_tests
      - name: Commit goldens back
        run: |
          git config user.name "telorama-ci"
          git config user.email "ci@telorama.invalid"
          git add tests/golden/
          git status --porcelain
          git commit -m "Generate Round 5 dark goldens" || echo "no changes"
          git push origin HEAD:round5-theme
