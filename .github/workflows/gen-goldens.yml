name: gen-goldens
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Clean install from the committed lockfile and build the export
        run: |
          cd web
          echo "EVIDENCE lockfile bytes: $(wc -c < package-lock.json)"
          npm ci --no-audit --no-fund
          echo "EVIDENCE clean install: OK"
          npm run build
          echo "EVIDENCE index bytes: $(wc -c < out/index.html)"
          if grep -rq "0.6.0" out/; then echo "EVIDENCE engine stamp in export: 0.6.0 FOUND"; else echo "EVIDENCE engine stamp in export: 0.6.0 MISSING"; fi
