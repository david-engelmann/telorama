name: gen-goldens
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.100.0
      - name: Regenerate the Round 44 goldens, gallery, and viewer record
        run: |
          UPDATE_GOLDENS=1 UPDATE_GALLERY=1 UPDATE_RECORD=1 cargo test --workspace
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Round 44: generate goldens, gallery, and viewer record"
          git push origin HEAD:round44-price-rows-build
