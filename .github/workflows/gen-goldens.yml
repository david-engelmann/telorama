name: gen-goldens
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: round7-docs
      - uses: dtolnay/rust-toolchain@1.100.0
      - name: Regenerate the gallery page
        run: UPDATE_GALLERY=1 cargo test -p telorama-svg --test gallery_tests
      - name: Commit the page back
        run: |
          git config user.name "telorama-ci"
          git config user.email "ci@telorama.invalid"
          git add docs/gallery.html
          if git diff --cached --quiet; then
            echo "gallery unchanged"
          else
            git commit -m "Regenerate the gallery for the INV-81 session findings"
            git push origin HEAD:round7-docs
          fi
