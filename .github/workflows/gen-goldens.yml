name: Generate goldens

on:
  workflow_dispatch:

jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.100.0
      - name: Generate the agent state golden
        run: |
          UPDATE_GOLDENS=1 cargo test -p telorama-svg --test golden_tests golden_agent_state_scene 2>&1 | tail -n 3
          echo "GOLDEN_BEGIN"
          base64 -w0 tests/golden/agent_state_scene.svg
          echo
          echo "GOLDEN_END"
