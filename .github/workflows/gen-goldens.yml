name: gen-goldens
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.100.0
      - name: Generate the wide names dark golden
        run: |
          UPDATE_GOLDENS=1 cargo test -p telorama-svg --test golden_tests golden_wide_names_scene_dark -- --exact --nocapture
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tests/golden/wide_names_scene_dark.svg
          git commit -m "Round 38: generate the wide names dark golden"
          git push origin HEAD:round38-wide-names-dark
