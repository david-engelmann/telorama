name: gen-goldens

on:
  workflow_dispatch:

jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.100.0
      - name: Generate goldens and lockfile
        run: |
          UPDATE_GOLDENS=1 cargo test -p telorama-svg --test golden_tests
          cargo generate-lockfile
          echo "===LOCKFILE_B64_BEGIN==="
          base64 -w0 Cargo.lock
          echo
          echo "===LOCKFILE_B64_END==="
          echo "===CHECKOUT_B64_BEGIN==="
          base64 -w0 tests/golden/checkout_scene.svg
          echo
          echo "===CHECKOUT_B64_END==="
          echo "===API_B64_BEGIN==="
          base64 -w0 tests/golden/api_scene.svg
          echo
          echo "===API_B64_END==="
