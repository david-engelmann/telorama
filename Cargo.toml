[workspace]
resolver = "2"
members = [
    "crates/telorama-scene",
    "crates/telorama-ingest",
    "crates/telorama-svg",
    "crates/telorama",
    "crates/telorama-mcp",
]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.88"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
telorama-scene = { path = "crates/telorama-scene", version = "0.6.0" }
telorama-ingest = { path = "crates/telorama-ingest", version = "0.6.0" }
telorama-svg = { path = "crates/telorama-svg", version = "0.6.0" }

[profile.release]
debug = false
